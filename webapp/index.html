<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Shortest Path Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="controls">
        <h3>Mesh Viewer</h3>
        <button onclick="showFractureZone()">Fracture Zone</button><br>
        <button onclick="showDamageZone()">Damage Zone</button><br>
        <button onclick="resetCamera()">Reset camera</button>
        <button onclick="toggleWireframe()">Toggle wireframe</button>

        <div id="layerControls" style="margin-top: 15px;">
            <h4>Layers</h4>
            <div id="layerCheckboxes"></div>
        </div>
    </div>
    <div id="info">
        Controls: Rotate (left mouse button), Pan (right mouse button), Roll (Shift + left mouse buttin), Zoom (mouse wheel)
    </div>
    <div id="metadata"></div>
    <div id="container"></div>

    <script type="module" src="/src/app.ts"></script>
</body>
</html>
